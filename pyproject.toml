[project]
name = "memorycreep"
version = "0.2.0"
description = "Hardened NixOS workstation for policy-bound AI-assisted security testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Masic"}
]
keywords = [
    "penetration-testing",
    "security",
    "ai",
    "llm",
    "mcp",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm==1.82.0",
    "openai==2.0.0",
    "anthropic==0.84.0",
    "tiktoken==0.12.0",
    "aiohttp==3.13.0",
    "aiofiles==25.0.0",
    "playwright==1.50.0",
    "beautifulsoup4==4.12.0",
    "httpx==0.27.0",
    "numpy==2.0.0",
    "networkx==3.3",
    "docker==7.1.0",
    "rich==14.0.0",
    "textual==8.0.0",
    "typer==0.24.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.2.0",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.0",
    "jinja2==3.1.0",
    "pyte==0.8.0",
    "pyperclip==1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "black==26.0.0",
    "isort==8.0.0",
    "mypy==1.19.0",
    "ruff==0.15.0",
]
rag = [
    "sentence-transformers==5.0.0",
    "faiss-cpu==1.8.0",
]
[project.urls]
Homepage = "https://github.com/timfewi/memorycreep"
Repository = "https://github.com/timfewi/memorycreep"
Upstream = "https://github.com/GH05TCREW/pentestagent"

[project.scripts]
memorycreep = "pentestagent.interface.main:main"
memorycreep-host = "pentestagent.host_cli:main"
memorycreep-broker = "pentestagent.broker:main"
memorycreep-guest = "pentestagent.guest_launcher:main"
memorycreep-guest-setup = "pentestagent.guest_setup:main"
pentestagent = "pentestagent.interface.main:main"
pta = "pentestagent.host_cli:main"
pentestagent-broker = "pentestagent.broker:main"
pentestagent-guest = "pentestagent.guest_launcher:main"
pentestagent-guest-setup = "pentestagent.guest_setup:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pentestagent"]

[tool.hatch.build.targets.sdist]
include = [
    "pentestagent/**",
    "*.md",
    "*.txt"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = [
    # TUI and CLI cannot be unit-tested without an interactive terminal
    "pentestagent/interface/*",
    "pentestagent/interface/widgets/*",
    # MCP server transports require a running server process
    "pentestagent/mcp/server/*",
    "pentestagent/mcp/stdio_adapter.py",
    "pentestagent/mcp/example_adapter.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["pentestagent"]

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = ["third_party/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
