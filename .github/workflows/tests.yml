name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.12 tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Run all Python tests
        env:
          OPENAI_API_KEY: test-openai-placeholder
          ANTHROPIC_API_KEY: test-anthropic-placeholder
          PENTESTAGENT_MODEL: gpt-4o
        run: |
          nix develop .#all --command python -m pytest -q tests \
            --cov=pentestagent \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=30

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-python-3.12
          path: coverage.xml
          retention-days: 14
